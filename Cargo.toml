[package]
name = "pdftool"
version = "0.1.2"
edition = "2024"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
pdfium-render = "0.9.3"
image = { version = "0.25.10", default-features = false, features = ["png"] }
webpx = "0.4.0"
anyhow = "1.0.104"
indicatif = "0.18.6"

[profile.release]
# Maximizar rendimiento
# Sin paralelismo en codegen: permite optimizaciones globales más agresivas a costa de compilación más lenta
codegen-units = 1

# LTO completo entre crates: maximiza inlining y elimina código muerto
lto = "fat"

# Minimizar tamaño
# Cancela el stack unwinding en pánico
panic = "abort"

# Elimina tabla de símbolos y debuginfo
strip = "symbols"
